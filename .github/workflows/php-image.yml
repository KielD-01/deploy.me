# Publishes the heavy PHP base images to Docker Hub for amd64 and arm64, so an
# install pulls them instead of compiling the extensions: the full flavour's
# (core/local/php/Dockerfile.base: FrankenPHP, Postgres and Redis extensions)
# and the slim one's (Dockerfile.base-slim: plain PHP CLI, SQLite), with -slim
# tags. Each flavour and architecture builds on its own native runner (under
# QEMU the compile takes half an hour), then one tag points at both arches.
#
# Needs the repository secrets DOCKERHUB_USERNAME and DOCKERHUB_TOKEN (a Docker
# Hub access token with write access). Rebuilt weekly too, for FrankenPHP and
# Debian security fixes. The Docker Hub page's overview is
# core/local/php/DOCKERHUB.md, synced each run.
#
# Versions: core/local/php/VERSION holds MAJOR.MINOR, bumped by hand — MINOR
# when Dockerfile.base adds or changes something, MAJOR when an image built on
# it could break (another PHP major, an extension gone). Every publish is the
# next PATCH of that line, counted from what Docker Hub already has, so a weekly
# rebuild is 1.0.1, 1.0.2… and no full version is ever pushed twice. Tags:
# MAJOR.MINOR.PATCH (fixed), MAJOR.MINOR and MAJOR (moving; installs use MAJOR),
# latest, and sha-<commit>; the slim flavour gets the same version with -slim
# (1.1.0-slim, 1.1-slim, 1-slim, sha-<commit>-slim) and `slim` for latest.
name: PHP base image

on:
  push:
    branches: [main]
    paths:
      - core/local/php/Dockerfile.base
      - core/local/php/Dockerfile.base-slim
      - core/local/php/VERSION
      - core/local/php/DOCKERHUB.md
      - .github/workflows/php-image.yml
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

env:
  IMAGE: ${{ vars.DOCKERHUB_IMAGE || 'romanovich0195/deployme-php' }}

concurrency:
  group: php-image
  cancel-in-progress: false

jobs:
  # Only the public repository publishes, and only once it has the Docker Hub
  # credentials; a fork, a mirror or a repository without them skips quietly.
  check:
    if: github.repository == 'KielD-01/deploy.me'
    runs-on: ubuntu-24.04
    outputs:
      ready: ${{ steps.secrets.outputs.ready }}
      version: ${{ steps.version.outputs.version }}
      minor: ${{ steps.version.outputs.minor }}
      major: ${{ steps.version.outputs.major }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # A change to what an image holds is a new MINOR (or MAJOR): the same
      # version can't stand for two different Dockerfiles. Both flavours share
      # VERSION, so a change to either bumps it.
      - name: A base Dockerfile changed, so VERSION did too
        if: github.event_name == 'push' && github.event.before != '0000000000000000000000000000000000000000'
        run: |
          changed=$(git diff --name-only "${{ github.event.before }}" "$GITHUB_SHA" -- core/local/php/Dockerfile.base core/local/php/Dockerfile.base-slim core/local/php/VERSION)
          if printf '%s\n' "$changed" | grep -qxE 'core/local/php/Dockerfile\.base(-slim)?' && ! printf '%s\n' "$changed" | grep -qx core/local/php/VERSION; then
            echo "::error file=core/local/php/VERSION::A base Dockerfile changed: bump the MINOR (or MAJOR) in core/local/php/VERSION."
            exit 1
          fi

      - id: version
        name: Work out the version
        run: |
          line=$(tr -d '[:space:]' < core/local/php/VERSION)
          [[ "$line" =~ ^[0-9]+\.[0-9]+$ ]] || { echo "::error file=core/local/php/VERSION::VERSION holds MAJOR.MINOR, like 1.0 (got '$line')."; exit 1; }
          major=${line%%.*}

          # What deploy.me pulls has to be this line's MAJOR (1 and 1-slim both read as 1).
          for file in core/local/php/Dockerfile docker-compose.local.yml compose.slim.yml bin/build bin/configure; do
            if grep -o 'deployme-php:[0-9][0-9.]*' "$file" | grep -vqx "deployme-php:$major"; then
              echo "::error file=$file::It pulls another major than VERSION's $major."
              exit 1
            fi
          done

          # The next PATCH: one past the highest MAJOR.MINOR.N on Docker Hub
          # (the -slim tags carry the same N, and don't match the pattern).
          repo=${IMAGE}
          url="https://hub.docker.com/v2/repositories/${repo}/tags?page_size=100&name=${line}."
          last=-1
          while [ -n "$url" ] && [ "$url" != null ]; do
            page=$(curl -fsS --retry 3 "$url")
            for patch in $(jq -r --arg line "$line" '.results[].name | select(test("^" + ($line | gsub("\\."; "\\.")) + "\\.[0-9]+$")) | split(".")[2]' <<< "$page"); do
              [ "$patch" -gt "$last" ] && last=$patch
            done
            url=$(jq -r '.next' <<< "$page")
          done
          version="$line.$((last + 1))"

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "minor=$line" >> "$GITHUB_OUTPUT"
          echo "major=$major" >> "$GITHUB_OUTPUT"
          echo "::notice::Publishing ${IMAGE}:${version}"

      - id: secrets
        env:
          USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [ -n "$USERNAME" ] && [ -n "$TOKEN" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Add the DOCKERHUB_USERNAME and DOCKERHUB_TOKEN secrets to publish the PHP base image."
          fi

  build:
    needs: check
    if: needs.check.outputs.ready == 'true'
    strategy:
      fail-fast: true
      matrix:
        flavour: [full, slim]
        arch: [amd64, arm64]
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-24.04
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
          - flavour: full
            file: core/local/php/Dockerfile.base
          - flavour: slim
            file: core/local/php/Dockerfile.base-slim
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.file }}
          platforms: ${{ matrix.platform }}
          pull: true
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          # The full flavour keeps the cache scope it always had.
          cache-from: type=gha,scope=${{ matrix.flavour == 'full' && matrix.platform || format('slim-{0}', matrix.platform) }}
          cache-to: type=gha,mode=max,scope=${{ matrix.flavour == 'full' && matrix.platform || format('slim-{0}', matrix.platform) }}
          labels: |
            org.opencontainers.image.title=deployme-php
            org.opencontainers.image.version=${{ needs.check.outputs.version }}${{ matrix.flavour == 'slim' && '-slim' || '' }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.licenses=MIT

      - name: Keep the digest for the manifest
        run: |
          mkdir -p "${{ runner.temp }}/digests"
          digest="${{ steps.build.outputs.digest }}"
          touch "${{ runner.temp }}/digests/${digest#sha256:}"

      - uses: actions/upload-artifact@v4
        with:
          name: digest-${{ matrix.flavour }}-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: [check, build]
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        flavour: [full, slim]
    env:
      VERSION: ${{ needs.check.outputs.version }}
      MINOR: ${{ needs.check.outputs.minor }}
      MAJOR: ${{ needs.check.outputs.major }}
      FLAVOUR: ${{ matrix.flavour }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/digests
          pattern: digest-${{ matrix.flavour }}-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # full: 1.1.0 1.1 1 latest sha-abc1234
      # slim: 1.1.0-slim 1.1-slim 1-slim slim sha-abc1234-slim
      - name: Tag both architectures as one image
        working-directory: ${{ runner.temp }}/digests
        run: |
          suffix=""; newest=latest
          if [ "$FLAVOUR" = slim ]; then suffix=-slim; newest=slim; fi
          sources=()
          for digest in *; do sources+=("$IMAGE@sha256:$digest"); done
          docker buildx imagetools create \
            -t "$IMAGE:$VERSION$suffix" -t "$IMAGE:$MINOR$suffix" -t "$IMAGE:$MAJOR$suffix" -t "$IMAGE:$newest" -t "$IMAGE:sha-${GITHUB_SHA::7}$suffix" \
            "${sources[@]}"

      - name: Check it
        run: |
          suffix=""; newest=latest
          if [ "$FLAVOUR" = slim ]; then suffix=-slim; newest=slim; fi
          docker buildx imagetools inspect "$IMAGE:$VERSION$suffix"
          echo "### ${IMAGE}:${VERSION}${suffix}" >> "$GITHUB_STEP_SUMMARY"
          echo "Also tagged ${MINOR}${suffix}, ${MAJOR}${suffix}, ${newest} and sha-${GITHUB_SHA::7}${suffix}." >> "$GITHUB_STEP_SUMMARY"

  # The repository's page on Docker Hub: a one-line summary and the overview.
  # Separate from the build, so a failed build doesn't leave the page stale.
  describe:
    needs: check
    if: needs.check.outputs.ready == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: peter-evans/dockerhub-description@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: ${{ env.IMAGE }}
          short-description: "PHP 8.5 runtime for deploy.me: FrankenPHP, or :slim (plain PHP, SQLite). ssh, git, rsync. amd64 + arm64"
          readme-filepath: core/local/php/DOCKERHUB.md
          enable-url-completion: true
