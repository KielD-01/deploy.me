name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: composer test

  image:
    if: github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/example-api
    steps:
      - uses: docker/build-push-action@v6
        with:
          load: true
          tags: example-api:ci
      - name: Push to GHCR
        run: |
          docker tag example-api:ci "$IMAGE:${GITHUB_SHA}"
          docker push "$IMAGE:${GITHUB_SHA}"
          docker push "$IMAGE:latest"
