; The scheduler lives next to the workers: it needs the same SSH and project
; mounts, and deployme-supervise starts it again if it dies.
[program:scheduler]
command=php /app/artisan schedule:work --no-ansi
directory=/app
autostart=true
autorestart=true
startsecs=3
stopsignal=TERM
stopwaitsecs=30
stopasgroup=true
killasgroup=true
redirect_stderr=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
