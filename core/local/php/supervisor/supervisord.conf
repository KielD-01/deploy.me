; deploy.me — supervisord for deployme-worker (queue workers + scheduler).
[unix_http_server]
file=/run/deployme/supervisor.sock
chmod=0700

[supervisord]
nodaemon=true
logfile=/dev/null
logfile_maxbytes=0
pidfile=/run/deployme/supervisord.pid

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///run/deployme/supervisor.sock

[include]
files = /etc/supervisor/conf.d/*.conf
