; The slim flavour's workers (bin/configure --flavour slim): the same programs,
; queues and timeouts as conf.d/queues.conf, on the database queue driver of its
; SQLite file instead of Valkey. SQLite has one writer at a time, so there are
; fewer of them, and an idle worker looks for a job every two seconds instead of
; every second (each look is a short write transaction). The Dockerfile puts
; this file in conf.d/queues.conf when it builds the slim image.
;
; Each queue has its own connection so retry_after always exceeds --timeout
; (config/queue.php). A job still running is never handed to a second worker.

; Deploys run for up to two hours (a big image build, a worker that finishes
; its job before Compose replaces it, then the health checks) and are never
; retried by the worker: a retry is an explicit "retry from failed step" in
; the UI. App\Jobs\RunDeployment::TIMEOUT stays below --timeout.
[program:deploys]
command=php /app/artisan queue:work redis-deploys --queue=deploys --name=deploys --tries=1 --timeout=7200 --sleep=2 --max-time=7200 --memory=256
process_name=%(program_name)s_%(process_num)02d
numprocs=2
directory=/app
autostart=true
autorestart=true
startsecs=3
stopsignal=TERM
stopwaitsecs=120
stopasgroup=true
killasgroup=true
redirect_stderr=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0

; Folder syncs: an hour at most each, in a worker of their own on the same
; connection (it mounts the project folders read-write too), so two long syncs
; never hold every deploy in the queue. App\Jobs\SyncFolder stays below --timeout.
[program:syncs]
command=php /app/artisan queue:work redis-deploys --queue=syncs --name=syncs --tries=1 --timeout=3600 --sleep=2 --max-time=7200 --memory=256
process_name=%(program_name)s_%(process_num)02d
numprocs=1
directory=/app
autostart=true
autorestart=true
startsecs=3
stopsignal=TERM
stopwaitsecs=120
stopasgroup=true
killasgroup=true
redirect_stderr=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0

; Server probes, connection checks and health checks: short and retryable. Two
; workers, where the full flavour runs four: the slim one is for a few servers.
[program:probes]
command=php /app/artisan queue:work redis-probes --queue=probes --name=probes --tries=2 --timeout=120 --sleep=2 --max-time=3600 --memory=256
process_name=%(program_name)s_%(process_num)02d
numprocs=2
directory=/app
autostart=true
autorestart=true
startsecs=3
stopsignal=TERM
stopwaitsecs=130
stopasgroup=true
killasgroup=true
redirect_stderr=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0

; Everything else: detection, mirror sync, CI polling, retention.
[program:default]
command=php /app/artisan queue:work redis --queue=interactive,default --name=default --tries=3 --timeout=300 --sleep=2 --max-time=3600 --memory=256
process_name=%(program_name)s_%(process_num)02d
numprocs=1
directory=/app
autostart=true
autorestart=true
startsecs=3
stopsignal=TERM
stopwaitsecs=310
stopasgroup=true
killasgroup=true
redirect_stderr=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
