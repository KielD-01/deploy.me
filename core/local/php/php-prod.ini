; deploy.me — production mode (the Dockerfile's app target), after php.ini.
; The code is baked into the image and only changes with a rebuild, which starts
; new containers: nothing to re-check.
opcache.validate_timestamps = 0
; The scheduler starts a PHP process every minute and artisan one-offs run
; often: the file cache keeps them from compiling the framework each time.
opcache.enable_cli = 1
opcache.file_cache = /tmp/opcache
