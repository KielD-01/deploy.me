; deploy.me — local PHP overrides
memory_limit = 512M
max_execution_time = 60
upload_max_filesize = 20M
post_max_size = 20M
expose_php = Off
date.timezone = Europe/Kyiv

; Development mode: the code is bind-mounted and edited live, so file timestamps
; are re-checked, at most every 2 s (stat-ing every file on every request over a
; macOS bind mount costs 50-150 ms). Production mode (the app target) overrides
; this with php-prod.ini.
opcache.enable = 1
opcache.enable_cli = 0
opcache.validate_timestamps = 1
opcache.revalidate_freq = 2
