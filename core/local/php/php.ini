; deploy.me — local PHP overrides
memory_limit = 512M
max_execution_time = 60
upload_max_filesize = 20M
post_max_size = 20M
expose_php = Off
date.timezone = Europe/Kyiv

; Code is bind-mounted and edited live: always re-check file timestamps.
opcache.enable = 1
opcache.enable_cli = 0
opcache.validate_timestamps = 1
opcache.revalidate_freq = 0
